<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>myMAG – Онлайн магазин</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ГОРНА ЛЕНТА -->
  <header class="top-bar">
    <div class="container">
      <div class="logo">myMAG</div>
      <nav>
        <a href="#">Продукти</a>
        <a href="#">Промоции</a>
        <a href="#">Контакти</a>
        <a href="#">🛒 Кошница</a>
      </nav>
    </div>
  </header>

  <!-- ОСНОВНО СЪДЪРЖАНИЕ -->
  <main class="container">
    <h2 class="section-title">Най-продавани</h2>

    <div class="products">

      <div class="product">
        <img src="img/product1.jpg" alt="Продукт">
        <h3>Смартфон XYZ</h3>
        <p class="price">599 лв</p>
        <button>Добави в кошницата</button>
      </div>

      <div class="product">
        <img src="img/product2.jpg" alt="Продукт">
        <h3>Лаптоп ABC</h3>
        <p class="price">1299 лв</p>
        <button>Добави в кошницата</button>
      </div>

    </div>
  </main>

</body>
</html>
